        <h2>建议政策</h2>
        <p>建议正式上架时采用 7 天内可退款。买家如果无法正常解锁专业版，或软件与上架说明明显不符，可以申请退款。</p>

        <h2>不适用退款的情况</h2>
        <ul>
          <li>已经正常使用后，仅因个人不再需要而申请退款。</li>
          <li>把授权码分享给他人后导致的授权问题。</li>
          <li>第三方付款平台、浏览器或设备导致的问题，但我们会协助排查。</li>
        </ul>

        <h2>处理方式</h2>
        <p>请发送订单信息和问题说明到 <a href="#" data-support-email>未配置</a>。我们会在 3 个工作日内处理。</p>
