        <h1>隐私说明</h1>
        <p>更新日期：2026-06-10</p>

        <h2>我们收集什么</h2>
        <p>OfferDesk 当前版本是静态网页工具。你输入的客户、项目、报价和成本信息只保存在你的浏览器本地，不会发送到我们的服务器。</p>

        <h2>付款信息</h2>
        <p>如果你点击付款链接，付款会在第三方收款平台完成。付款平台可能会收集付款所需的信息，具体以该平台的隐私政策为准。</p>

        <h2>本地保存</h2>
        <p>软件会使用浏览器本地存储保存草稿和授权状态。你可以通过清理浏览器网站数据删除这些内容。</p>
